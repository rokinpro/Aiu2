  <rect width="900" height="600" rx="46" fill="#174d3f"/>
  <rect x="18" y="18" width="864" height="564" rx="30" fill="none" stroke="#fff" stroke-width="12"/>
  <text x="66" y="116" fill="#e7f1e8" font-family="Arial,sans-serif" font-size="53" font-weight="700" letter-spacing="5">AIU2 · ELEVATOR A</text>

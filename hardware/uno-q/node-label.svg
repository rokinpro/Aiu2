  <rect x="65" y="265" width="770" height="215" rx="24" fill="#fff"/>
  <text x="104" y="332" fill="#174d3f" font-family="Arial,sans-serif" font-size="34" font-weight="700" letter-spacing="5">CONNECT TO</text>
